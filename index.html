<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="以 40 題日常情境檢測十大劣根性，產出盲點雷達圖、面向排序與改善行動。">
<title>成功習慣盲點檢測</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;800&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}

/* Layout: single centered column (max 720px); one question per card, results stacked: radar → ranking → top-3 detail */
:root{
  --bg:#EEF2F3; --surface:#FFFFFF; --ink:#18232E; --muted:#5B6874; --line:#D5DDE1;
  --accent:#2C6E6F; --accent-soft:#DCEBEA; --warn:#B9792A; --warn-soft:#F5E8D4; --hot:#B4533D;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10171C; --surface:#18222A; --ink:#E4EBEE; --muted:#97A5AE; --line:#2C3A44;
  --accent:#62B3B1; --accent-soft:#1F3536; --warn:#E0A75A; --warn-soft:#3A2E1D; --hot:#E08A72; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10171C; --surface:#18222A; --ink:#E4EBEE; --muted:#97A5AE; --line:#2C3A44;
  --accent:#62B3B1; --accent-soft:#1F3536; --warn:#E0A75A; --warn-soft:#3A2E1D; --hot:#E08A72; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.35}
h1{font-size:clamp(1.7rem,5vw,2.3rem);font-weight:800}
h2{font-size:1.35rem}
h3{font-size:1.12rem}
p{margin:0}
.eyebrow{font-size:.78rem;letter-spacing:.12em;color:var(--accent);font-weight:700}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font:inherit;font-weight:700;border-radius:10px;padding:11px 20px;border:1px solid var(--accent);background:var(--accent);color:var(--surface);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.opt:focus-visible,.lk button:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.notes{display:grid;gap:8px;padding-left:1.2em;margin:0}
.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qmeta{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:.78rem;padding:2px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:700}
.qtext{font-size:1.12rem;font-weight:500}
.opts{display:grid;gap:10px}
.opt{font:inherit;text-align:left;padding:13px 16px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;line-height:1.55}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);font-weight:500}
.lk{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lk button{font:inherit;padding:12px 2px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;font-size:.82rem;line-height:1.3}
.lk button b{display:block;font-size:1.1rem;font-variant-numeric:tabular-nums}
.lk button.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.radar{width:100%;max-width:440px;margin:0 auto;display:block}
.radar text{fill:var(--muted);font-size:13px;font-family:var(--f-body)}
.radar .ring{fill:none;stroke:var(--line)}
.radar .axis{stroke:var(--line)}
.radar .area{fill:var(--warn);fill-opacity:.22;stroke:var(--warn);stroke-width:2}
.radar .dot{fill:var(--warn)}
.radar .top{fill:var(--hot);font-weight:700}
.radar .rl{font-size:10px;fill:var(--muted)}
.rank{display:grid;gap:9px}
.rk{display:grid;grid-template-columns:1.6em 6.2em 1fr 3em;gap:10px;align-items:center;font-variant-numeric:tabular-nums}
.rk .n{color:var(--muted);font-size:.85rem}
.rk .bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.rk .bar i{display:block;height:100%;border-radius:6px}
.rk .v{text-align:right;font-weight:700}
.lv{font-size:.75rem;padding:1px 8px;border-radius:99px;font-weight:700;white-space:nowrap}
.lv-0{background:var(--accent-soft);color:var(--accent)}
.lv-1{background:var(--accent-soft);color:var(--muted)}
.lv-2{background:var(--warn-soft);color:var(--warn)}
.lv-3{background:var(--warn-soft);color:var(--hot)}
.focus{border-left:4px solid var(--warn)}
.focus .head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.focus .score{font-family:var(--f-display);font-size:1.6rem;color:var(--warn);font-variant-numeric:tabular-nums}
.sub{font-size:.8rem;letter-spacing:.08em;color:var(--muted);font-weight:700}
.focus ul,.focus ol{margin:0;padding-left:1.3em;display:grid;gap:6px}
.reframe{background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:.95rem}
.legend{font-size:.82rem;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.cons{font-size:.92rem;padding:12px 14px;border-radius:10px;background:var(--bg);border:1px dashed var(--line)}
.strength{display:grid;gap:8px}
@media (max-width:480px){.rk{grid-template-columns:1.3em 5.4em 1fr 2.6em;gap:7px}.card{padding:18px}.lk button{font-size:.72rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap" id="app"></div>

<script>
const DIMS={
A:{name:'確信偏好',orig:'自以為是',desc:'習慣以自己的判斷為準，別人的方法要先通過你的評估才會被採用。',
 beh:['收到建議時，只挑「我覺得有道理」的部分，其餘略過','方法成效普通時，先認為是「做得還不夠多」，較少懷疑方法本身','覺得多餘的流程步驟，會私下省略'],
 act:['下次收到建議，先完整照做兩週，期間不加入自己的修改，再比較結果','每月挑一個你最有把握的做法，請一位成果比你好的人挑毛病','同時記錄「我的方法」和「建議的方法」的成效，讓數據替你判斷'],
 rf:'有主見是你的資產。結果還沒達到想要的樣子時，把判斷力用在「驗證別人的方法」上，成長會更快。',str:'願意先照做再判斷'},
B:{name:'保留質疑',orig:'不以為然',desc:'面對別人的成果或建議，第一反應容易是找出它不適用自己的理由。',
 beh:['聽到夥伴的好成績，先想到「他條件比較好」或「運氣不錯」','簡單的建議會被歸類成「太基本」','聽案例分享時，心裡在找例外而不是找可借用的步驟'],
 act:['每次聽到別人的成果，先問一句「你是怎麼做到的？」','把「那不適用我」改寫成「其中哪一步我可以借用？」','挑一個你曾覺得太基本的建議，連續做 7 天'],
 rf:'能質疑代表你不盲從。先找出可借用的那一步，再討論不適用的部分，兩者就能兼得。',str:'能從別人的成果中找到可學之處'},
C:{name:'已知感',orig:'老氣橫秋',desc:'對聽過的觀念容易產生「我知道了」的感覺，讓「知道」悄悄取代了「做到」。',
 beh:['聽到熟悉的內容會分心，覺得是重複','被問「試過嗎？」時，回答「知道」而不是說明有沒有做過','讀書或上課只記新鮮的觀點，熟悉的部分直接跳過'],
 act:['把「我知道」換成「我做到幾成」：上課時在筆記旁替自己打 0–10 分','回答問題時區分三種程度：聽過／試過／持續在做','每次複習舊內容，找出一個這次才注意到的細節'],
 rf:'你吸收得快、聽過的東西多，這是基礎。把每個「知道」再往前推一步到「做到」，差距就在這裡被補上。',str:'把知道的事真正做出來'},
D:{name:'資歷依附',orig:'倚老賣老',desc:'傾向用年資和經歷來證明自己，對新方法、新工具或資淺者的做法比較保留。',
 beh:['說服別人時，先提到自己做了多久、經歷多少','新人提出不同做法時，第一句是提醒風險','面對新工具或新玩法，習慣「先觀察一陣子」'],
 act:['改用「最近三個月的實際成果」作為說服別人的依據','每月向一位比你資淺、但某方面做得好的人請教一件事','挑一個新工具，給自己兩週學到能實際用在工作上'],
 rf:'經驗讓你少走很多冤枉路。當經驗加上新方法，它的價值才會繼續增加，而不是停在過去。',str:'對新方法與新人保持開放'},
E:{name:'關注範圍',orig:'漠不關心',desc:'注意力容易被與目標無關的資訊佔據，和成長相關的話題參與度偏低。你關心什麼，會決定你的未來。',
 beh:['聚會聊天多落在日常、八卦或追劇','群組裡的心得分享「已讀，之後再看」，之後通常沒再看','空檔時間習慣滑短影音放鬆'],
 act:['每次聚會主動問一個問題：「你最近在嘗試什麼？」','群組心得看完後，至少留下一個問題或一個行動','每天固定 15 分鐘，看一段跟目標有關的內容'],
 rf:'你懂得放鬆，這很重要。只要把其中一小段時間換給目標，累積下來的差距會很明顯。',str:'把注意力放在跟目標有關的事上'},
F:{name:'單飛傾向',orig:'格格不入',desc:'偏好自己處理，較少主動融入團隊的節奏或尋求協助。團隊合作的成果通常大於單打獨鬥。',
 beh:['卡關時先自己研究，不太想麻煩別人','團隊分工時等被分配，或乾脆自己做完比較快','進入新環境時，習慣保持觀望的距離'],
 act:['給自己一條規則：卡關超過 30 分鐘就問一個人','團隊活動主動認領一個小任務，並回報一次進度','每週和一位夥伴做 15 分鐘的進度交流'],
 rf:'獨立作業能力強是優點。把它和團隊接上線，你的能力會被放大，而不是只靠自己撐。',str:'能融入團隊並主動求助'},
G:{name:'外在歸因',orig:'怨天尤人',desc:'事情不順時，較快看到環境、別人或制度的因素，自己能掌控的部分容易被忽略。',
 beh:['檢討時先列出外部原因：假日多、景氣差、支援不夠','客戶取消時，先判斷是對方沒誠意','看到身邊的人遇到困境，傾向歸給大環境'],
 act:['每次檢討先寫「我能控制的一件事」，再寫外部因素','把抱怨的句子改寫成「下次我會……」','寫一份自己的危機清單：如果現在的收入停了，第二條路是什麼'],
 rf:'你看得到環境的問題，代表觀察力敏銳。把同樣的觀察力轉向自己能動的那一塊，就會變成行動力。',str:'先從自己能控制的部分找原因'},
H:{name:'低能量對話',orig:'自怨自艾',desc:'遇到挫折時，內心的自我對話容易轉向「我不行」或「大概就這樣了」，從認命轉向知命需要刻意練習。',
 beh:['連續被拒絕後，開始懷疑自己適不適合','被問近況時，常回「還好」「最近不太順」','想到幾年後的自己，不太敢描繪具體畫面'],
 act:['被拒絕後只做一件事：把原因分類記下來，不評價自己','每天睡前寫下一件今天有進展的小事','把三年後的一天寫成具體畫面：在哪裡、做什麼、跟誰，放在看得到的地方'],
 rf:'會感到失落，代表你在乎。知道自己的處境、願意改變它，就是「知命」的起點。',str:'挫折後能很快回到行動'},
I:{name:'方向漂移',orig:'善變',desc:'目標或方法容易因為新機會、或短期看不到成果而變動，初心容易被沖淡。',
 beh:['今年的目標中途換過一兩次','看到別的項目賺得快，會想撥時間兼著試','一件事做了兩個月沒成果，就開始懷疑方向'],
 act:['寫下「當初為什麼開始」的三個理由，每次想換方向前先重讀','設定 90 天的「不換方向期」，期間只調整方法、不換目標','新機會先放進觀察清單，30 天後還想做再評估'],
 rf:'你對機會敏感、願意嘗試。給方向一段足夠長的時間，才看得出它真正的成果。',str:'方向清楚，能堅持到看見成果'},
J:{name:'動機衰減',orig:'健忘',desc:'上課或受到啟發時動力很強，回到日常後很快淡掉，容易忘記自己為什麼要成功。',
 beh:['上完一堂有感覺的課，幾天後就恢復原樣','初衷說得出來，但平常很少想起','只有在開會、上課或被問到時，才會想到目標'],
 act:['上完課當晚，寫下一個「明天就做」的具體行動','把初衷做成手機桌布或鎖定畫面','每天固定一個時間花 1 分鐘看一下目標進度'],
 rf:'你容易被啟發，代表心裡有想要的東西。只要替熱情加上提醒機制，它就能撐過日常。',str:'把熱情帶回日常並持續'}
};
const K=Object.keys(DIMS);

// 情境題：s = 各面向得分（0–3，可跨面向）
const Q=[
{id:'a1',tag:'面對建議',t:'你照自己的方式跑了一個月，成效普通。一位做得不錯的前輩建議你換一套做法。你最可能：',o:[
 ['先照前輩的方式完整試兩週，再比較結果',{}],['挑其中我覺得有道理的部分，加進原本的做法',{A:1}],['先說明我的方法為什麼這樣設計，請他看完再給意見',{A:2}],['再給自己的方法一點時間，通常是執行量還不夠',{A:3}]]},
{id:'b1',tag:'團隊合作',t:'夥伴在會議上分享他這個月成交了一筆大單。你第一個念頭比較接近：',o:[
 ['他是怎麼談成的？想問問他的流程',{}],['這次運氣成分應該不小',{B:3}],['真不錯，我也要加油',{J:1}],['他手上的客戶本來就比較多',{B:2,G:1}]]},
{id:'c1',tag:'學習',t:'主管又提到一個你已經聽過很多次的觀念。你的反應比較像：',o:[
 ['心裡想「又是這個」，開始想別的事',{C:3,E:1}],['想想這次自己實際做到了幾成',{}],['點點頭，這部分我已經掌握了',{C:2}],['聽聽看這次有沒有新的例子',{C:1}]]},
{id:'d1',tag:'團隊合作',t:'一位比你資淺的新人，提出和你不同的做法。你會：',o:[
 ['先問他怎麼想的，有效的話我也學',{}],['提醒他這條路我走過，有幾個地方容易出問題',{D:2,A:1}],['讓他試試看，碰到問題他自然就懂了',{D:2,B:1}],['兩種做法各試一週，比較結果',{}]]},
{id:'e1',tag:'團隊合作',t:'團隊聚會時，你們的話題最常落在：',o:[
 ['生活瑣事、追劇或八卦',{E:3}],['最近誰做了什麼新嘗試',{}],['看氣氛，大家聊什麼就跟著聊',{E:2}],['目標進度和卡關的地方',{}]]},
{id:'L1',lk:'A',rev:true,tag:'自我描述',t:'別人的建議，我通常會先完整照做一次，再判斷好不好。'},
{id:'f1',tag:'團隊合作',t:'團隊要辦一場活動，需要分工。你會：',o:[
 ['主動認領一塊，並跟其他人對進度',{}],['等分配到我再開始做',{F:2,E:1}],['我自己處理比較快，不太想等別人',{F:2,A:1}],['覺得這種場合不太適合我，盡量幫忙就好',{F:3}]]},
{id:'g1',tag:'挫折',t:'客戶臨時取消了談好的訂單。你心裡的第一句話比較像：',o:[
 ['最近景氣差，大家都在縮',{G:3}],['他根本沒什麼誠意',{G:2}],['是哪個環節我可以先預防？',{}],['算了，換下一位',{E:1}]]},
{id:'h1',tag:'挫折',t:'連續被拒絕三次之後，你最常出現的念頭是：',o:[
 ['我是不是不太適合做這個',{H:3}],['整理一下這三次被拒的原因',{}],['唉，又來了',{H:2}],['換個時段或對象再試',{}]]},
{id:'i1',tag:'目標',t:'你今年設定的目標，到現在的狀況是：',o:[
 ['跟年初一樣，進度有落差但沒換',{}],['中途換過一兩次，找到更適合的',{I:2}],['已經記不太清楚當初怎麼定的',{I:1,J:2}],['每季檢視後微調，大方向沒變',{}]]},
{id:'j1',tag:'學習',t:'上完一堂很有感覺的課，回到家之後：',o:[
 ['當晚寫下一個明天就要做的行動',{}],['很有動力，但過幾天就恢復原本的步調',{J:3}],['跟家人分享心得',{J:1}],['把筆記收好，之後需要時再翻',{J:2}]]},
{id:'L2',lk:'G',rev:false,tag:'自我描述',t:'事情不順的時候，多半是環境或別人的因素。'},
{id:'a2',tag:'學習',t:'一堂課的內容，有一半你覺得自己大致都懂。你會：',o:[
 ['懂的部分當複習，專心找自己還沒做到的細節',{}],['懂的部分先處理手機訊息，重點段落再專心聽',{A:1,E:2}],['記下講師和我想法不同的地方，課後去問',{}],['判斷這堂對我幫助不大，下次挑進階一點的',{A:3,C:1}]]},
{id:'b2',tag:'學習',t:'講師舉了一個成功案例，但對方的條件跟你很不一樣。你會：',o:[

{id:'i2',tag:'行動',t:'你看到別人做另一個項目，收入成長得很快。你會：',o:[
 ['了解一下，但專注在原本的事',{}],['撥一點時間兼著試試看',{I:2}],['認真考慮轉過去',{I:3}],['回頭問自己：當初選這條路的理由還成立嗎？',{}]]},
{id:'L4',lk:'C',rev:true,tag:'自我描述',t:'聽到熟悉的觀念時，我會重新檢查自己到底做到了沒。'},
{id:'j2',tag:'目標',t:'關於你當初開始這份事業（或目前目標）的理由，你：',o:[

{id:'a3',tag:'行動',t:'團隊定了一套作業流程，你覺得其中一個步驟有點多餘。你會：',o:[

{id:'b3',tag:'面對建議',t:'有人給你一個很簡單的建議：「每天固定時間聯絡三位客戶。」你覺得：',o:[
 ['簡單的事最難持續，我先做 30 天看看',{}],['道理都懂，但實際狀況複雜多了',{B:3,C:1}],['這有點基本，我想知道更進階的方法',{B:2,A:1}],['我有在做類似的，可以對照看看細節',{C:1}]]},
{id:'c3',tag:'學習',t:'讀一本關於成功習慣的書時，你通常會：',o:[
 ['遇到熟悉的觀念就快速翻過',{C:2}],['熟悉的觀念也會停下來，想想有沒有做到',{}],['只替新鮮的觀點畫線',{C:1}],['讀完很少回頭看，因為大部分都懂了',{C:3,J:1}]]},

 ['想找他教我怎麼用',{}],['新工具來來去去，基本功才是長久的',{D:2,B:1}],['那是年輕人那一代的玩法',{D:3,F:1}],['先觀察一陣子，再決定要不要學',{D:1}]]},
{id:'e3',tag:'行動',t:'突然多出一小時的空檔，你最可能：',o:[
 ['滑短影音放鬆一下',{E:2}],['看一段跟目標有關的內容',{}],['找一個人聊聊近況和計畫',{}],['沒特別做什麼，時間就過去了',{E:3,I:1}]]},
{id:'f3',tag:'挫折',t:'工作上卡關時，你的第一反應是：',o:[
 ['自己再研究一下，盡量不麻煩別人',{F:2}],['直接問有經驗的夥伴',{}],['等下次開會再提出來',{F:1,J:1}],['先放著，去做別的事',{F:1,E:1}]]},
{id:'L6',lk:'E',rev:true,tag:'自我描述',t:'我會主動找跟目標有關的話題和人聊天。'},
{id:'g3',tag:'挫折',t:'看到身邊的人收入停滯、甚至被裁員，你的感受比較接近：',o:[
 ['大環境就是這樣，不是個人能改變的',{G:3,H:1}],['提醒我現在就要建立第二條路',{}],['很同情，但跟我關係不大',{E:2}],['公司和政府應該負起責任',{G:2}]]},
{id:'h3',tag:'目標',t:'想到三年後的自己，你比較接近哪一種：',o:[
 ['大概跟現在差不多吧',{H:3}],['有具體的畫面，正在往那裡走',{}],['希望會更好，但不太敢想太多',{H:2}],['有方向，路徑還在摸索',{H:1}]]},
{id:'i3',tag:'行動',t:'一件事做了兩個月，還沒看到明顯成果。你會：',o:[
 ['開始懷疑方向，想換方法或換跑道',{I:3}],['對照計畫，看是量不夠還是方法錯',{}],['熱度下降，做得斷斷續續',{I:2,J:1}],['繼續做，但把標準放低一點',{I:1,H:1}]]},
{id:'L7',lk:'D',rev:true,tag:'自我描述',t:'比我資淺的人，也常常讓我學到東西。'},
{id:'j3',tag:'目標',t:'一週裡，你想到自己目標的時機通常是：',o:[
 ['每天都會想到',{}],['開會或上課的時候',{J:3}],['遇到挫折的時候',{J:1,H:1}],['被別人問起的時候',{J:2,E:1}]]},
{id:'L8',lk:'B',rev:false,tag:'自我描述',t:'我常覺得別人的成功，沒有表面上看起來那麼厲害。'},
{id:'L9',lk:'I',rev:false,tag:'自我描述',t:'我很容易被新機會吸引，而分散原本的專注。'},
{id:'L10',lk:'J',rev:true,tag:'自我描述',t:'上課時燃起的熱情，通常能維持到一週以後。'}
];
const LK=['非常不符合','不太符合','一半一半','還算符合','非常符合'];

// 選項順序隨機（每次開始時決定，作答中固定）
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let S={i:-1,ans:{},ord:{}};
function save(){try{localStorage.setItem('hm-state',JSON.stringify(S))}catch(e){}}
function load(){try{const v=JSON.parse(localStorage.getItem('hm-state'));if(v&&v.ans)S=v}catch(e){}}
function newOrder(){S.ord={};Q.forEach(q=>{if(q.o)S.ord[q.id]=shuffle([0,1,2,3])})}

const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function score(){
  const r={};K.forEach(k=>r[k]={e:0,m:0,se:0,sm:0,lk:null});
  Q.forEach(q=>{
    const a=S.ans[q.id];
    if(q.lk){const d=r[q.lk];d.m+=3;if(a!=null){const v=q.rev?(5-a)*.75:(a-1)*.75;d.e+=v;d.lk=v/3}}
    else{K.forEach(k=>{const mx=Math.max(...q.o.map(o=>o[1][k]||0));if(!mx)return;r[k].m+=mx;r[k].sm+=mx;if(a!=null){const v=q.o[a][1][k]||0;r[k].e+=v;r[k].se+=v}})}
  });
  return K.map(k=>{const d=r[k];return{k,pct:Math.round(d.e/d.m*100),sc:d.sm?d.se/d.sm:0,lk:d.lk}});
}
const level=p=>p>=66?[3,'明顯盲點']:p>=46?[2,'值得留意']:p>=26?[1,'偶爾出現']:[0,'穩健'];
const lvColor=p=>p>=46?'var(--warn)':'var(--accent)';

function radar(res,sample){
  const cx=200,cy=200,R=125,n=res.length,ang=i=>-Math.PI/2+i*2*Math.PI/n;
  const pt=(i,v)=>[cx+Math.cos(ang(i))*R*v,cy+Math.sin(ang(i))*R*v];
  const top=sample?[]:res.slice().sort((a,b)=>b.pct-a.pct).slice(0,3).map(x=>x.k);
  let s=`<svg class="radar" viewBox="-30 0 460 400" role="img" aria-label="十個面向的盲點指數雷達圖">`;
  [.25,.5,.75,1].forEach(f=>{s+=`<polygon class="ring" points="${res.map((_,i)=>pt(i,f).join(',')).join(' ')}"/>`});
  [25,50,75,100].forEach(v=>{s+=`<text class="rl" x="${cx+4}" y="${cy-R*v/100+11}">${v}</text>`});
  res.forEach((d,i)=>{const[x,y]=pt(i,1);s+=`<line class="axis" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/>`});
  s+=`<polygon class="area" points="${res.map((d,i)=>pt(i,Math.max(d.pct,3)/100).join(',')).join(' ')}"/>`;
  res.forEach((d,i)=>{const[x,y]=pt(i,Math.max(d.pct,3)/100);s+=`<circle class="dot" cx="${x}" cy="${y}" r="3.5"/>`});
  res.forEach((d,i)=>{const[x,y]=pt(i,1.17);const c=Math.cos(ang(i));const an=Math.abs(c)<.2?'middle':c>0?'start':'end';
    s+=`<text x="${x}" y="${y+5}" text-anchor="${an}" class="${top.includes(d.k)?'top':''}">${DIMS[d.k].name}</text>`});
  return s+'</svg>';
}

function intro(){
  const has=Object.keys(S.ans).length;
  const sample=K.map((k,i)=>({k,pct:[42,58,35,20,64,30,48,55,38,70][i]}));
  app.innerHTML=`
  <header style="display:grid;gap:10px">
    <span class="eyebrow">自我覺察 · 情境檢測</span>
    <h1>成功習慣盲點檢測</h1>
    <p class="muted">40 個日常情境，約 8 分鐘。看見自己的慣性反應，和成功習慣之間還差哪一步。</p>
  </header>
  <section class="card">
    <h2>作答前</h2>
    <ul class="notes">
      <li>選「你真的會怎麼做」，不是「你覺得應該怎麼做」。</li>
      <li>沒有標準答案，每個選項都是常見的反應。</li>
      <li>如果都不完全符合，選最接近的那一個。</li>
      <li>結果只存在你這台裝置的瀏覽器裡。</li>
    </ul>
    <div class="row">
      <button class="btn" id="start">${has?'重新開始':'開始作答'}</button>
      ${has?`<button class="btn ghost" id="resume">${has>=Q.length?'查看上次結果':'繼續上次進度（'+has+'/'+Q.length+'）'}</button>`:''}
    </div>
  </section>
  <section class="card">
    <div class="row" style="justify-content:space-between"><h3>完成後你會看到</h3><span class="tag">結果範例</span></div>
    ${radar(sample,true)}
    <p class="muted" style="font-size:.92rem">十個面向的盲點雷達圖、依分數排序的清單，以及最需要留意的 3 個面向：具體會出現的行為，和可以馬上開始的改善行動。</p>
  </section>`;
  document.getElementById('start').onclick=()=>{S={i:0,ans:{},ord:{}};newOrder();save();question()};
  const r=document.getElementById('resume');if(r)r.onclick=()=>{if(!Object.keys(S.ord).length)newOrder();has>=Q.length?result():(S.i=Math.min(has,Q.length-1),question())};
}

function question(){
  const q=Q[S.i],a=S.ans[q.id];
  let body;
  if(q.lk){body=`<div class="lk" role="group" aria-label="符合程度">${LK.map((l,i)=>`<button data-v="${i+1}" class="${a===i+1?'sel':''}"><b>${i+1}</b>${l}</button>`).join('')}</div>`}
  else{body=`<div class="opts">${S.ord[q.id].map(oi=>`<button class="opt ${a===oi?'sel':''}" data-v="${oi}">${esc(q.o[oi][0])}</button>`).join('')}</div>`}
  app.innerHTML=`
  <div class="qmeta"><span>第 ${S.i+1} / ${Q.length} 題</span><span>${Math.round(Object.keys(S.ans).length/Q.length*100)}%</span></div>
  <div class="progress"><i style="width:${(S.i+1)/Q.length*100}%"></i></div>
  <section class="card">
    <span><span class="tag">${q.tag}</span></span>
    <p class="qtext">${esc(q.t)}</p>
    ${body}
    <div class="row" style="justify-content:space-between">
      <button class="btn ghost" id="prev" ${S.i===0?'disabled':''}>上一題</button>
      <button class="btn ghost" id="home">回首頁</button>
    </div>
  </section>`;
  app.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{
    S.ans[q.id]=+b.dataset.v;save();
    app.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('sel',x===b));
    setTimeout(()=>{if(S.i<Q.length-1){S.i++;save();question()}else{const miss=Q.findIndex(x=>S.ans[x.id]==null);if(miss>=0){S.i=miss;question()}else result()}},220);
  });
  document.getElementById('prev').onclick=()=>{S.i--;save();question()};
  document.getElementById('home').onclick=intro;
  window.scrollTo(0,0);
}

function result(){
  const res=score();
  const sorted=res.slice().sort((a,b)=>b.pct-a.pct);
  const top=sorted.slice(0,3),best=sorted.slice(-2).reverse();
  const gap=res.filter(d=>d.lk!=null&&Math.abs(d.sc-d.lk)>=.5).map(d=>DIMS[d.k].name);
  const avg=Math.round(res.reduce((s,d)=>s+d.pct,0)/res.length);
  const cons=gap.length<=1?['高','情境題和自我描述題的方向一致，結果可信度較高。']:gap.length<=3?['中',`「${gap.join('、')}」的情境反應和自我描述有些落差，這通常代表這幾個面向在不同情境下表現不一，可以多留意。`]:['偏低',`有 ${gap.length} 個面向的情境反應和自我描述不太一致。建議以情境題的反應為主要參考，過一兩週再測一次。`];
  app.innerHTML=`
  <header style="display:grid;gap:8px">
    <span class="eyebrow">你的檢測結果</span>
    <h1>盲點雷達</h1>
    <p class="muted">分數越高，代表這個面向的慣性反應離成功習慣越遠，也是成長空間最大的地方。整體平均 <b style="color:var(--ink)">${avg}</b>。</p>
  </header>
  <section class="card">
    ${radar(res)}
    <div class="legend"><span>0–25 穩健</span><span>26–45 偶爾出現</span><span>46–65 值得留意</span><span>66–100 明顯盲點</span></div>
  </section>
  <section class="card">
    <h2>十個面向排序</h2>
    <div class="rank">${sorted.map((d,i)=>{const L=level(d.pct);return`<div class="rk"><span class="n">${i+1}</span><span>${DIMS[d.k].name}</span><span class="bar"><i style="width:${Math.max(d.pct,2)}%;background:${lvColor(d.pct)}"></i></span><span class="v">${d.pct}</span></div>`}).join('')}</div>
    <p class="cons">作答一致性：<b>${cons[0]}</b>。${cons[1]}</p>
  </section>
  <h2 style="margin-top:8px">最需要留意的 3 個面向</h2>
  ${top.map((d,i)=>{const D=DIMS[d.k],L=level(d.pct);return`
  <section class="card focus">
    <div class="head"><div style="display:grid;gap:2px"><span class="sub">第 ${i+1} 名 · 對應課程「${D.orig}」</span><h3>${D.name} <span class="lv lv-${L[0]}">${L[1]}</span></h3></div><span class="score">${d.pct}</span></div>
    <p>${D.desc}</p>
    <div style="display:grid;gap:6px"><span class="sub">你可能會出現的行為</span><ul>${D.beh.map(b=>`<li>${b}</li>`).join('')}</ul></div>
    <div style="display:grid;gap:6px"><span class="sub">這週就能開始的改善行動</span><ol>${D.act.map(b=>`<li>${b}</li>`).join('')}</ol></div>
    <p class="reframe">${D.rf}</p>
  </section>`}).join('')}
  <section class="card">
    <h2>你已經做得不錯的地方</h2>
    <div class="strength">${best.map(d=>`<p><b>${DIMS[d.k].name}（${d.pct}）</b>：你在「${DIMS[d.k].str}」這件事上表現穩定，可以當作帶動其他面向的支點。</p>`).join('')}</div>
    <p class="muted" style="font-size:.9rem">建議 30 天後再測一次，比較雷達圖的變化。改變一個習慣，通常比同時改三個更容易成功：先從第 1 名的第一個行動開始。</p>
    <div class="row"><button class="btn" id="again">重新作答</button><button class="btn ghost" id="home2">回首頁</button></div>
  </section>`;
  document.getElementById('again').onclick=()=>{S={i:0,ans:{},ord:{}};newOrder();save();question()};
  document.getElementById('home2').onclick=intro;
  window.scrollTo(0,0);
}

load();intro();
</script>
